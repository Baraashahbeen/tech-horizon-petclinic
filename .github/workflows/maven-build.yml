# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/use-cases-and-examples/building-and-testing/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{matrix.java}}
        uses: actions/setup-java@v4
        with:
          java-version: ${{matrix.java}}
          distribution: 'adopt'
          cache: maven
      - name: Format Java and report formatted security regression test
        run: |
          ./mvnw -B -ntp spring-javaformat:apply
          echo '===FORMATTED_SECURITY_TEST_START==='
          base64 -w0 src/test/java/org/springframework/samples/petclinic/owner/FormBindingSecurityTests.java
          echo
          echo '===FORMATTED_SECURITY_TEST_END==='
      - name: Build with Maven Wrapper
        run: ./mvnw -B verify
