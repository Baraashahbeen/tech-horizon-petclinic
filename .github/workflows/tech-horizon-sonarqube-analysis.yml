name: Tech Horizon - SonarQube Code Analysis

# Manual workflow: requires narrowly scoped AWS IAM user credentials in GitHub Secrets.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'docker-compose.yml'
      - 'k8s/**'
      - '.github/workflows/tech-horizon-sonarqube-analysis.yml'

permissions:
  contents: read
  statuses: write

jobs:
  sonar-analysis:
    name: Maven Tests and SonarQube Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    env:
      AWS_REGION: eu-north-1
      SONAR_INSTANCE_ID: i-049c298ed38cac2e1
      SONAR_PROJECT_KEY: Tech-Horizon---PetClinic
      SONAR_HOST_URL: http://127.0.0.1:19000

    steps:
      - name: Mark SonarQube analysis as running
        env:
          GH_STATUS_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"state":"pending","context":"Tech Horizon / SonarQube","description":"SonarQube analysis is running on main"}'
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_STATUS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17 and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Generate disposable database passwords for integration tests
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          {
            printf 'MYSQL_ROOT_PASSWORD=%s\n' "$(openssl rand -hex 24)"
            printf 'MYSQL_PASSWORD=%s\n' "$(openssl rand -hex 24)"
            printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)"
          } > .env

      - name: Run Maven tests and generate JaCoCo coverage
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp clean verify
          test -s target/site/jacoco/jacoco.xml

      - name: Authenticate to AWS with restricted IAM credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_SONAR_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SONAR_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '439996178122'

      - name: Install AWS Session Manager plugin
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb \
            --output /tmp/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb
          session-manager-plugin --version

      - name: Connect privately to SonarQube through AWS SSM
        shell: bash
        run: |
          set -euo pipefail
          aws ssm start-session \
            --region "$AWS_REGION" \
            --target "$SONAR_INSTANCE_ID" \
            --document-name AWS-StartPortForwardingSession \
            --parameters '{"portNumber":["9000"],"localPortNumber":["19000"]}' \
            > /tmp/tech-horizon-ssm.log 2>&1 &
          echo $! > /tmp/tech-horizon-ssm.pid

          for attempt in {1..45}; do
            if curl --fail --silent --show-error --max-time 3 \
              "$SONAR_HOST_URL/api/system/status" 2>/dev/null | grep -q '"status":"UP"'; then
              echo "Private SSM tunnel connected. SonarQube status: UP."
              exit 0
            fi
            sleep 2
          done

          echo "::error::SonarQube is unavailable through SSM. Check EC2 SSM managed-instance status and IAM permissions."
          tail -n 30 /tmp/tech-horizon-ssm.log || true
          exit 1

      - name: Analyze with SonarScanner for Maven
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "::error::SONAR_TOKEN repository secret is missing."
            exit 1
          fi
          ./mvnw -B -ntp \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.maven.scanAll=true

      - name: Check SonarQube processing and display Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          task_file="target/sonar/report-task.txt"
          test -f "$task_file"
          task_id="$(sed -n 's/^ceTaskId=//p' "$task_file")"
          test -n "$task_id"

          processed=false
          for attempt in {1..60}; do
            task_status="$(curl --fail --silent --show-error --user "$SONAR_TOKEN:" \
              "$SONAR_HOST_URL/api/ce/task?id=$task_id" | jq -r '.task.status')"
            if [[ "$task_status" == "SUCCESS" ]]; then
              processed=true
              break
            fi
            if [[ "$task_status" == "FAILED" || "$task_status" == "CANCELED" ]]; then
              echo "::error::SonarQube background analysis failed: $task_status"
              exit 1
            fi
            sleep 5
          done
          if [[ "$processed" != "true" ]]; then
            echo "::error::SonarQube analysis task did not finish within polling limit."
            exit 1
          fi
          gate_json="$(curl --fail --silent --show-error --user "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=$SONAR_PROJECT_KEY")"
          gate="$(jq -r '.projectStatus.status' <<< "$gate_json")"
          echo "Quality Gate: $gate"
          echo "$gate_json" | jq -r '.projectStatus.conditions[] | [.metricKey,.status,.actualValue,.errorThreshold] | @tsv'
          measures="$(curl --fail --silent --show-error --user "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/measures/component?component=$SONAR_PROJECT_KEY&metricKeys=coverage,duplicated_lines_density,security_rating,vulnerabilities,bugs,code_smells,ncloc")"
          echo "Final SonarQube measures:"
          echo "$measures" | jq -r '.component.measures[] | [.metric,.value] | @tsv'
          if [[ "$gate" != "OK" ]]; then
            echo "::warning::Quality Gate is $gate. The scan completed, but the configured quality policy is not satisfied."
          fi

      - name: Publish verified analysis result to GitHub commit status
        if: success()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GH_STATUS_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gate_json="$(curl --fail --silent --show-error --user "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=$SONAR_PROJECT_KEY")"
          gate="$(jq -r '.projectStatus.status' <<< "$gate_json")"
          measures="$(curl --fail --silent --show-error --user "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/measures/component?component=$SONAR_PROJECT_KEY&metricKeys=coverage,duplicated_lines_density")"
          coverage="$(jq -r '[.component.measures[] | select(.metric=="coverage") | .value][0] // "n/a"' <<< "$measures")"
          duplication="$(jq -r '[.component.measures[] | select(.metric=="duplicated_lines_density") | .value][0] // "n/a"' <<< "$measures")"
          issues_json="$(curl --fail --silent --show-error --user "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/issues/search?componentKeys=$SONAR_PROJECT_KEY&resolved=false&ps=1")"
          open_issues="$(jq -r '.paging.total // .total // "n/a"' <<< "$issues_json")"
          if [[ "$gate" == "OK" ]]; then
            state=success
          else
            state=failure
          fi
          description="Quality Gate: $gate; open issues: $open_issues; coverage: $coverage%; duplicates: $duplication%"
          echo "$description"
          {
            echo "## SonarQube analysis completed"
            echo ""
            echo "- Quality Gate: $gate"
            echo "- Open issues: $open_issues"
            echo "- Coverage: $coverage%"
            echo "- Duplications: $duplication%"
            echo "- Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
          payload="$(jq -nc --arg state "$state" --arg description "$description" \
            --arg context "Tech Horizon / SonarQube" \
            '{state:$state,description:($description|.[0:140]),context:$context}')"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_STATUS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Publish failed analysis status
        if: failure()
        env:
          GH_STATUS_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload="$(jq -nc \
            --arg state failure \
            --arg context "Tech Horizon / SonarQube" \
            --arg description "Analysis did not complete; inspect the GitHub Actions run" \
            --arg target_url "$run_url" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_STATUS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Upload Maven test and JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tech-horizon-sonarqube-analysis-reports
          path: |
            target/site/jacoco/
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Close the SSM tunnel
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/tech-horizon-ssm.pid ]]; then
            kill "$(cat /tmp/tech-horizon-ssm.pid)" 2>/dev/null || true
          fi
