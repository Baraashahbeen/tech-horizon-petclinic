name: SonarQube Main Analysis

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze main with SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || vars.SONAR_HOST_URL }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify SonarQube configuration
        shell: bash
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo '::error::Configure SONAR_TOKEN as a GitHub Actions repository secret.'
            exit 1
          fi
          if [ -z "$SONAR_HOST_URL" ]; then
            echo '::error::Configure SONAR_HOST_URL as a GitHub Actions secret or variable.'
            exit 1
          fi
      - name: Build, test and analyze main branch
        shell: bash
        run: |
          ./mvnw -B -ntp clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar \
            -Dsonar.projectKey=Tech-Horizon---PetClinic \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true
