name: Format Security Remediation Java
on:
  push:
    branches: [ fix/controller-binding-allowlists ]
    paths:
      - '.github/workflows/format-remediation-branch.yml'
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/controller-binding-allowlists
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Apply Spring Java formatting
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp spring-javaformat:apply
      - name: Commit formatting changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/main/java src/test/java
            git diff --cached --quiet || git commit -m "style: apply Spring Java formatting to remediation tests"
            git push origin HEAD:fix/controller-binding-allowlists
          fi
